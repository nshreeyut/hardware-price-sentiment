[project]
name = "mining-project"
version = "0.1.0"
description = "Hardware Price Tracker + Reddit Sentiment Analysis"
requires-python = ">=3.12"

dependencies = [
    # Jupyter
    "jupyterlab>=4.0",
    "ipykernel>=6.0",

    # Data
    "pandas>=2.0",
    "numpy>=1.26",

    # Web scraping — Notebook 01
    "requests>=2.31",
    "urllib3>=2.0",
    "beautifulsoup4>=4.12",
    "cloudscraper>=1.2",
    "selenium>=4.18",
    "undetected-chromedriver>=3.5",

    # Web scraping — Notebook 02
    "praw>=7.7",

    # NLP / sentiment — Notebook 03
    "nltk>=3.8",
    "spacy>=3.7",
    "vaderSentiment>=3.3",

    # ML / stats — Notebook 04
    "scikit-learn>=1.4",
    "scipy>=1.12",

    # Visualization
    "matplotlib>=3.8",
]
